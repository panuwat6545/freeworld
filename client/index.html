<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Freeworld</title>
  <!-- ไม่มีการโหลดฟอนต์/ไอคอน/ภาพจากภายนอกเลย ใช้ฟอนต์ระบบ (system font stack) เท่านั้น -->
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #12100d;
      color: #f0ead6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #app {
      position: relative;
      display: inline-block;
    }
    #fw-canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #1a1a1a;
    }
    .fw-status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      padding: 8px 12px;
      background: rgba(18, 16, 13, 0.85);
      font-size: 13px;
    }
    .fw-stat b { color: #ffd166; }
    .fw-controls { margin-left: auto; display: flex; gap: 6px; align-items: center; }
    .fw-controls button {
      background: #2a2620;
      color: #f0ead6;
      border: 1px solid #4a4438;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 12px;
    }
    .fw-controls button.fw-active { background: #5a9c3f; border-color: #5a9c3f; }
    .fw-controls button:hover { border-color: #ffd166; }
    #fw-save-status { min-width: 120px; font-size: 12px; color: #9ad; }

    .fw-character-panel {
      position: absolute;
      top: 48px;
      right: 12px;
      width: 220px;
      background: rgba(18, 16, 13, 0.92);
      border: 1px solid #4a4438;
      padding: 12px;
      font-size: 13px;
    }
    .fw-character-panel h3 { margin: 0 0 8px; color: #ffd166; }
    .fw-character-panel p { margin: 4px 0; }
    .fw-close {
      position: absolute;
      top: 6px;
      right: 8px;
      background: none;
      border: none;
      color: #f0ead6;
      font-size: 16px;
      cursor: pointer;
    }
    .fw-need-row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
    .fw-need-row span:first-child { width: 48px; }
    .fw-need-row span:last-child { width: 28px; text-align: right; }
    .fw-need-track { flex: 1; height: 8px; background: #2a2620; }
    .fw-need-fill { height: 100%; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./dist/bundle.js"></script>
</body>
</html>
